<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GabeTeX</title>
    <style>
      /* Before the stylesheet arrives: the window colour, so nothing flashes white in Dark Mode. */
      html, body { margin: 0; height: 100%; background: #ececee; }
      @media (prefers-color-scheme: dark) { html, body { background: #161617; } }
    </style>
  </head>
  <body>
    <header class="window-titlebar">
      <span class="titlebar-title">GabeTeX</span>
      <div class="titlebar-buttons">
        <button id="tb-minimize" class="titlebar-btn" aria-label="Minimize">−</button>
        <button id="tb-maximize" class="titlebar-btn" aria-label="Maximize">□</button>
        <button id="tb-close" class="titlebar-btn" aria-label="Close">×</button>
      </div>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
