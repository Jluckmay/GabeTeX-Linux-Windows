name: CI / Release

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request supersedes the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev xvfb file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build

      - name: Verify Linux glibc baseline
        if: matrix.name == 'linux'
        run: |
          if [ -f src-tauri/target/release/gabetex ] && readelf -V src-tauri/target/release/gabetex | grep -qE "GLIBC_2\.(3[6-9]|[4-9][0-9])"; then
            echo "Binary requires newer GLIBC than Ubuntu 22.04 (2.35):"
            readelf -V src-tauri/target/release/gabetex | grep -E "GLIBC_2\.[0-9]+"
            exit 1
          fi

      - name: Collect release assets
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION (${{ matrix.name }})"
          B=src-tauri/target/release/bundle
          mkdir -p out
          case "${{ matrix.name }}" in
            linux)
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/ 2>/dev/null || true
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/GabeTeX-linux-x86_64.AppImage 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/ 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/GabeTeX-linux-amd64.deb 2>/dev/null || true
              ;;
            windows)
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/ 2>/dev/null || true
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/GabeTeX-windows-x64-setup.exe 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/GabeTeX-windows-x64.msi 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_pt-BR.msi" out/ 2>/dev/null || true
              cp "$B/nsis/gabetex-standalone.exe" out/ 2>/dev/null || true
              cp src-tauri/target/release/gabetex.exe out/gabetex-standalone.exe 2>/dev/null || true
              ;;
            macos)
              cp "$B/dmg/GabeTeX_${VERSION}"*.dmg out/ 2>/dev/null || true
              for dmg in "$B/dmg/GabeTeX_${VERSION}"*.dmg; do
                [ -f "$dmg" ] && cp "$dmg" out/GabeTeX.dmg && break
              done
              if [ -d "$B/macos/GabeTeX.app" ]; then
                tar -czf "out/GabeTeX_${VERSION}_macos.app.tar.gz" -C "$B/macos" GabeTeX.app 2>/dev/null || true
              fi
              cp src-tauri/target/release/gabetex out/gabetex-macos-standalone 2>/dev/null || true
              ;;
          esac
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > GabeTeX-${VERSION}-SHA256SUMS.txt
          cat GabeTeX-${VERSION}-SHA256SUMS.txt

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX v%%VERSION%%

          Automatic release generated by GitHub Actions from tag `%%TAG%%`.

          ## What's New & Fixes

          - **Math & Linguistic Symbols sidebar (`Σ` / `Ctrl+Alt+3`)**: 15 categories and 470 symbols across core LaTeX, `amsmath`, `amssymb`, `mathrsfs`, `gensymb`, `mathdots`, and `eurosym`, plus text-mode **Linguistic Symbols** with PDF-style curly serif quotation marks, search, live preview, `\log_{}` base-subscript snippet, click-to-insert, and drag-and-drop onto any editor line.
          - **Context-aware delimiters & `\usepackage` auto-import**: automatically wraps symbols in `$...$` or `\[...\]` outside math mode (merging adjacent single `$` delimiters cleanly and skipping text-mode linguistic symbols) and inserts missing `\usepackage{...}` declarations into the preamble (or `main.tex` when editing preamble-less section files) in a single atomic Undo step.
          - **Smart auto-pairing & paired deletion**: closes `{ }`, `( )`, `[ ]`, `$ $`, `\( \)`, `\[ \]`, and `\begin{env}...\end{env}` on `}`, and deletes matched empty/non-empty pairs cleanly on `Backspace`/`Delete` while protecting command arguments and `\left(...\right)` delimiters.
          - **More project templates**: added **Book**, **Report**, and **Poster** alongside the six existing templates (9 templates total in EN / PT-BR) with symlink checks on folder creation.
          - **Security & reliability hardening**: strict `\usepackage` package name validation, serialized disk updates for background `main.tex` package imports, single- and multi-line preamble scanning fixes, custom accent contrast on active sidebar controls, plus all v1.1.1 Tectonic WASM, Zotero 7, accessibility, CSP, and Ubuntu 22.04 (`glibc 2.35`) improvements.

          ## Artifacts

          Executables and installers for Linux, Windows and macOS (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` and `.deb`
          - **Windows**: `.exe` (NSIS installer), `.msi`, and standalone `.exe`
          - **macOS (Tauri build)**: `.dmg`, `.app.tar.gz`, and standalone `gabetex-macos-standalone` *(for the native Swift macOS 26 app, see [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases))*

          ## SHA-256 Checksums

          See the attached file `GabeTeX-%%VERSION%%-SHA256SUMS.txt`.

          ## Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```

          ---

          # GabeTeX v%%VERSION%% (PT-BR)

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Novidades e Correções

          - **Tabela de Símbolos Matemáticos e Linguísticos (`Σ` / `Ctrl+Alt+3`)**: 15 categorias e 470 símbolos (LaTeX padrão, `amsmath`, `amssymb`, `mathrsfs`, `gensymb`, `mathdots`, `eurosym` e **Símbolos Linguísticos** em modo texto com aspas curvas em serifa estilo PDF), busca, prévia com pacotes, `\log_{}` com subscrito de base, inserção por clique ou drag-and-drop na linha exata do editor.
          - **Delimitadores automáticos e importação de `\usepackage`**: insere `$...$` ou `\[...\]` automaticamente fora do modo matemático (unindo delimitadores `$` adjacentes sem criar `$$` e preservando modo texto para símbolos linguísticos) e importa pacotes faltantes no preâmbulo (ou em `main.tex` ao editar subarquivos) em um único passo de Desfazer.
          - **Fechamento automático e remoção pareada**: fecha `{ }`, `( )`, `[ ]`, `$ $`, `\( \)`, `\[ \]` e `\begin{env}...\end{env}` ao digitar `}`, e apaga pares em `Backspace`/`Delete` protegendo argumentos de comandos e delimitadores `\left(...\right)`.
          - **Novos modelos de projeto**: adicionados **Livro**, **Relatório** e **Pôster** (9 modelos em inglês e português do Brasil) com verificação contra symlinks ao criar pastas.
          - **Segurança e estabilidade**: validação estrita de nomes em `\usepackage`, fila serializada para gravação em `main.tex`, suporte a preâmbulos de linha única e múltiplas linhas, contraste com `--on-accent` para cor personalizada e todas as melhorias da v1.1.1 (Tectonic WASM, Zotero 7, acessibilidade, CSP e compatibilidade com Ubuntu 22.04 / `glibc 2.35`).

          ## Artefatos

          Executáveis e instaladores para Linux, Windows e macOS (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` e `.deb`
          - **Windows**: `.exe` (instalador NSIS), `.msi` e `.exe` standalone
          - **macOS (build Tauri)**: `.dmg`, `.app.tar.gz` e executável standalone `gabetex-macos-standalone` *(para o app nativo Swift do macOS 26, consulte [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases))*

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-SHA256SUMS.txt` anexado.

          ## Verificação

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
