name: CI / Release

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request supersedes the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev xvfb file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build

      - name: Collect release assets
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION (${{ matrix.name }})"
          B=src-tauri/target/release/bundle
          mkdir -p out
          case "${{ matrix.name }}" in
            linux)
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/ 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/ 2>/dev/null || true
              ;;
            windows)
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_pt-BR.msi" out/ 2>/dev/null || true
              ;;
            macos)
              cp "$B/dmg/GabeTeX_${VERSION}"*.dmg out/ 2>/dev/null || true
              ;;
          esac
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > GabeTeX-${VERSION}-SHA256SUMS.txt
          cat GabeTeX-${VERSION}-SHA256SUMS.txt

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX %%VERSION%%

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Artefatos / Artifacts

          Executáveis e instaladores para Linux, Windows e macOS.
          Executables and installers for Linux, Windows and macOS.

          - **Linux**: `.AppImage` e `.deb`
          - **Windows**: `.exe` (NSIS) e `.msi`
          - **macOS**: `.dmg`

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-SHA256SUMS.txt` anexado.
          See the attached file `GabeTeX-%%VERSION%%-SHA256SUMS.txt`.

          ## Verificação / Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX $VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
