name: CI / Release

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request supersedes the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev xvfb file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build

      - name: Verify Linux glibc baseline
        if: matrix.name == 'linux'
        run: |
          if [ -f src-tauri/target/release/gabetex ] && readelf -V src-tauri/target/release/gabetex | grep -qE "GLIBC_2\.(3[6-9]|[4-9][0-9])"; then
            echo "Binary requires newer GLIBC than Ubuntu 22.04 (2.35):"
            readelf -V src-tauri/target/release/gabetex | grep -E "GLIBC_2\.[0-9]+"
            exit 1
          fi

      - name: Collect release assets
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION (${{ matrix.name }})"
          B=src-tauri/target/release/bundle
          mkdir -p out
          case "${{ matrix.name }}" in
            linux)
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/ 2>/dev/null || true
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/GabeTeX-linux-x86_64.AppImage 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/ 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/GabeTeX-linux-amd64.deb 2>/dev/null || true
              ;;
            windows)
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/ 2>/dev/null || true
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/GabeTeX-windows-x64-setup.exe 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/GabeTeX-windows-x64.msi 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_pt-BR.msi" out/ 2>/dev/null || true
              cp "$B/nsis/gabetex-standalone.exe" out/ 2>/dev/null || true
              cp src-tauri/target/release/gabetex.exe out/gabetex-standalone.exe 2>/dev/null || true
              ;;
            macos)
              cp "$B/dmg/GabeTeX_${VERSION}"*.dmg out/ 2>/dev/null || true
              for dmg in "$B/dmg/GabeTeX_${VERSION}"*.dmg; do
                [ -f "$dmg" ] && cp "$dmg" out/GabeTeX.dmg && break
              done
              if [ -d "$B/macos/GabeTeX.app" ]; then
                tar -czf "out/GabeTeX_${VERSION}_macos.app.tar.gz" -C "$B/macos" GabeTeX.app 2>/dev/null || true
              fi
              cp src-tauri/target/release/gabetex out/gabetex-macos-standalone 2>/dev/null || true
              ;;
          esac
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > GabeTeX-${VERSION}-SHA256SUMS.txt
          cat GabeTeX-${VERSION}-SHA256SUMS.txt

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX v%%VERSION%%

          Automatic release generated by GitHub Actions from tag `%%TAG%%`.

          ## What's New & Fixes

          - **Tectonic WASM compiler**: embedded in-browser fallback with SHA-256 resource verification, Beamer support, project-scoped PDF output, PDF export on build, and line-number-preserving `\today` local date resolution.
          - **Zotero 7 integration**: browse Zotero collections/items via `127.0.0.1:23119/api/users/0` (supporting Zotero 7 nested `data` envelopes) and save `zotero.bib` directly from Settings (with status & documentation link shown immediately).
          - **Appearance & localization**: Light/Dark/System themes, custom accent color with dynamic app icon, Brazilian Portuguese (`pt-BR`) UI, configurable auto-save, and multi-language spell checking (`en` / `pt-BR`) across headings and formatted prose.
          - **Accessibility**: per-page PDF landmarks, off-screen text fallback, accessible PDF links, and polite live compile/status announcements for screen readers.
          - **Security & cross-platform stability**: hardened Tauri Content Security Policy (CSP), canonicalized symlink extension checks in `open_in_default_app`, leading-`-` filename option-injection guards, environment-variable PowerShell path passing, normalized Windows path separators across the sidebar/tabs/outline, integrated TinyTeX setup inside the Windows NSIS installer, and Ubuntu 22.04 (`glibc 2.35`) compatible `.AppImage` and `.deb`.

          ## Artifacts

          Executables and installers for Linux, Windows and macOS (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` and `.deb`
          - **Windows**: `.exe` (NSIS installer), `.msi`, and standalone `.exe`
          - **macOS (Tauri build)**: `.dmg`, `.app.tar.gz`, and standalone `gabetex-macos-standalone` *(for the native Swift macOS 26 app, see [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases))*

          ## SHA-256 Checksums

          See the attached file `GabeTeX-%%VERSION%%-SHA256SUMS.txt`.

          ## Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```

          ---

          # GabeTeX v%%VERSION%% (PT-BR)

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Novidades e Correções

          - **Compilador Tectonic WASM**: compilação integrada em fallback sem distribuição TeX local, com verificação SHA-256, suporte ao Beamer, exportação do PDF ao compilar e data local correta em `\today` preservando números de linha.
          - **Integração com Zotero 7**: navegação por coleções/itens via `127.0.0.1:23119/api/users/0` (compatível com o formato aninhado `data` do Zotero 7) e gravação direta de `zotero.bib` nas Configurações (com status e link da documentação exibidos imediatamente).
          - **Aparência e idioma**: temas Claro/Escuro/Sistema, cor de destaque personalizada com ícone dinâmico, interface em Português do Brasil (`pt-BR`), salvamento automático configurável e corretor ortográfico em `en` / `pt-BR` em títulos e texto formatado.
          - **Acessibilidade**: marcação de páginas no preview de PDF, fallback de texto para leitores de tela, links acessíveis e anúncios ao vivo de compilação/status.
          - **Segurança e estabilidade multiplataforma**: política CSP restrita no Tauri, verificação de extensão após canonicalização de symlinks em `open_in_default_app`, proteção contra nomes de arquivo iniciados por `-`, normalização de separadores de caminho no Windows, instalação integrada do TinyTeX no instalador Windows NSIS e pacotes Linux `.AppImage` e `.deb` compatíveis com Ubuntu 22.04 (`glibc 2.35`).

          ## Artefatos

          Executáveis e instaladores para Linux, Windows e macOS (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` e `.deb`
          - **Windows**: `.exe` (instalador NSIS), `.msi` e `.exe` standalone
          - **macOS (build Tauri)**: `.dmg`, `.app.tar.gz` e executável standalone `gabetex-macos-standalone` *(para o app nativo Swift do macOS 26, consulte [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases))*

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-SHA256SUMS.txt` anexado.

          ## Verificação

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
